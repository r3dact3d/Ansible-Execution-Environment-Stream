---
- name: Playbook to create Execution Environment
  hosts: localhost
  gather_facts: false
  vars:
    ee_verbosity: 3
    ee_registry_dest: index.docker.io/r3dact3d
    ee_registry_username: r3dact3d
    # ee_registry_password:
    # ee_registry_dest: quay.io/brthomps
    # ee_registry_username: brthomps
    ee_ah_host: galaxy.ansible.com
    # ee_ah_token:
    ee_builder_dir_clean: false
    builder_dir: "."
    ee_version: 3
    ee_list:
      - name: ee-builder
        tag: 1.0.4
        base_image: docker.io/redhat/ubi9:latest
        dependencies:
          ansible_core:
            package_pip: ansible-core
          ansible_runner:
            package_pip: ansible-runner
          system:
            - podman
          python:
            - ansible-builder
          galaxy:
            collections:
              - name: infra.aap_configuration
              - name: ansible.platform
              - name: ansible.hub
              - name: ansible.eda
              - name: ansible.controller
        build_files:
          - src: ./ansible.cfg
            dest: configs
        build_steps:
          prepend_galaxy:
            - ADD _build/configs/ansible.cfg /etc/ansible/ansible.cfg

  roles:
    - infra.ee_utilities.ee_builder
