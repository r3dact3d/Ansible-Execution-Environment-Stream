---
- name: Playbook to create Execution Environment
  hosts: localhost
  gather_facts: false
  vars:
    ee_pull_collections_from_hub: false
    ee_ah_host: galaxy.ansible.com
    ee_builder_dir_clean: true
    ee_list:
      - name: ee-rhel9-aws-ps
        base_image: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest
        dependencies:
          ansible_core:
            package_pip: ansible-core
          ansible_runner:
            package_pip: ansible-runner
          system:
            - git
          python:
            - boto3
            - botocore
            - awscli
            - git-remote-codecommit
          galaxy:
            collections:
              - name: amazon.aws
                source: https://galaxy.ansible.com
              - name: community.windows
                source: https://galaxy.ansible.com
        build_steps:
          prepend_galaxy:
            - ENV ANSIBLE_GALAXY_SERVER_LIST=automation_hub_certified,upstream_galaxy
            - ENV ANSIBLE_GALAXY_SERVER_UPSTREAM_GALAXY_URL=https://galaxy.ansible.com/
            - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_URL=https://console.redhat.com/api/automation-hub/content/published/
            - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_AUTH_URL=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
            - ARG ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_TOKEN
          prepend_final:
            - RUN microdnf install -y git openssh-clients && microdnf clean all
            - RUN curl -sSL https://packages.microsoft.com/config/rhel/8/prod.repo > /etc/yum.repos.d/microsoft.repo
            - RUN microdnf install -y powershell
  roles:
    - infra.ee_utilities.ee_builder
