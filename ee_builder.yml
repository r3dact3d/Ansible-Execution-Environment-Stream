---
- name: Playbook to create Execution Environment
  hosts: localhost
  gather_facts: false
  vars:
    ee_verbosity: 3
    ee_registry_dest: index.docker.io/r3dact3d
    ee_registry_username: r3dact3d
    ee_pull_collections_from_hub: false
    ee_ah_host: galaxy.ansible.com
    ee_builder_dir_clean: true
    builder_dir: "."
    ee_version: 3
    ee_list:
      - name: ubi9-infra-ee-utilities-builder
        tag: 1.0.9
        base_image: docker.io/redhat/ubi9:latest
        dependencies:
          ansible_core:
            package_pip: ansible-core
          ansible_runner:
            package_pip: ansible-runner
          system:
            - podman
          python:
            - ansible-builder
            - ansible-navigator
          galaxy:
            collections:
              - infra.aap_configuration
              - ansible.hub
              - ansible.eda

  roles:
    - infra.ee_utilities.ee_builder
