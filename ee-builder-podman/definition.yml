---
- name: Playbook to create Execution Environment
  hosts: localhost
  gather_facts: false
  vars:
    ee_aap_version: 2.5
    ee_ah_host: galaxy.ansible.com
    ee_list:
      - name: ee_test_podman
        image: registry.fedoraproject.org/fedora:latest
        dependencies:
          ansible_core:
            package_pip: ansible-core==2.16
          ansible_runner:
            package_pip: ansible-runner
          system:
            - podman
            - fuse-overlayfs
            - ansible-builder
            - slirp4netns
          python:
            - ansible-navigator
            - pytz
            - python-dateutil>=2.7.0
            - awxkit
          galaxy:
            collections:
              - name: awx.awx
                version: 22.4.0
              - infra.aap_configuration
          exclude:
            system:
              - container-selinux
        options:
          tags:
            - ee_development:latest
        build_steps:
          prepend_galaxy:
            - ENV ANSIBLE_GALAXY_SERVER_LIST=automation_hub_certified,upstream_galaxy
            - ENV ANSIBLE_GALAXY_SERVER_UPSTREAM_GALAXY_URL=https://galaxy.ansible.com/
            - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_URL=https://console.redhat.com/api/automation-hub/content/validated/
            - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_AUTH_URL=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
            - ARG ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_TOKEN
          prepend_final:
            - RUN dnf -y update; yum -y reinstall shadow-utils
            - RUN useradd podman; echo podman:10000:5000 > /etc/subuid; echo podman:10000:5000 > /etc/subgid
            - VOLUME /var/lib/containers
            - VOLUME /etc/containers
            - VOLUME /home/podman/.local/share/containers
            - ADD https://raw.githubusercontent.com/containers/image_build/refs/heads/main/podman/containers.conf /etc/containers/containers.conf
            - ADD https://raw.githubusercontent.com/containers/image_build/refs/heads/main/podman/podman-containers.conf /home/podman/.config/containers/containers.conf
            - RUN chown podman:podman -R /home/podman/
            - RUN chmod 644 /etc/containers/containers.conf
            - RUN mkdir -p /var/lib/shared/overlay-images /var/lib/shared/overlay-layers /var/lib/shared/vfs-images /var/lib/shared/vfs-layers; touch /var/lib/shared/overlay-images/images.lock; touch /var/lib/shared/overlay-layers/layers.lock; touch /var/lib/shared/vfs-images/images.lock; touch /var/lib/shared/vfs-layers/layers.lock
            - ENV _CONTAINERS_USERNS_CONFIGURED=""
  roles:
    - infra.ee_utilities.ee_builder
